name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "Missing Actions secret: RAILWAY_TOKEN"; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "Missing Actions variable: RAILWAY_PROJECT_ID"; exit 1; }
          test -n "$RAILWAY_ENVIRONMENT_ID" || { echo "Missing Actions variable: RAILWAY_ENVIRONMENT_ID"; exit 1; }
          test -n "$RAILWAY_SERVICE_ID" || { echo "Missing Actions variable: RAILWAY_SERVICE_ID"; exit 1; }

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Build and deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "GitHub ${GITHUB_SHA}"
