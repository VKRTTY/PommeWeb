name: Deploy to Railway

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - build.sh
      - railway-start.sh
      - rust/**
      - patches/**
      - web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAILWAY_PROJECT_ID: 587ad760-e790-4588-a5d3-2d6e3c61a568
      RAILWAY_ENVIRONMENT_ID: 315a4e03-4d1b-4355-ae32-ffe5f7579e63
      RAILWAY_SERVICE_ID: 5f84d463-7b1d-4448-b94e-f830364a3ea6
    steps:
      - uses: actions/checkout@v4

      - name: Validate Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "Missing Actions secret: RAILWAY_TOKEN"; exit 1; }

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Build and deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "GitHub ${GITHUB_SHA}"
